<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HomeBite | Cook Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-gradient-to-b from-orange-50 via-stone-50 to-white font-[Inter] text-stone-900"><header class="border-b bg-white/90"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 p-4"><a href="index.html" class="font-[Playfair_Display] text-2xl font-bold">HomeBite</a><div class="flex items-center gap-3"><span data-homebite-user class="text-sm font-semibold text-orange-600"></span><button data-homebite-logout class="rounded-xl border px-3 py-2 text-sm">Logout</button></div></div></header><main class="mx-auto max-w-6xl p-4 py-10 md:p-8"><div class="mb-8"><p class="font-semibold text-orange-600">HOME COOK DASHBOARD</p><h1 class="font-[Playfair_Display] text-4xl font-bold">Manage your kitchen</h1><p class="mt-2 text-stone-500">Publish, update, and manage every meal your customers see.</p></div><div class="grid gap-7 lg:grid-cols-[.9fr_1.4fr]"><section class="rounded-3xl bg-white p-6 shadow-sm"><h2 id="form-title" class="text-xl font-bold">Add a meal</h2><form id="meal-form" class="mt-5 space-y-3"><input type="hidden" name="id"><input required name="name" placeholder="Meal name" class="w-full rounded-xl border p-3"><input required min="1" type="number" name="price" placeholder="Price in ₹" class="w-full rounded-xl border p-3"><input required name="cuisine" placeholder="Cuisine (e.g. South Indian)" class="w-full rounded-xl border p-3"><select required name="diet" class="w-full rounded-xl border p-3"><option value="">Diet</option><option>Veg</option><option>Non-Veg</option><option>Vegan</option></select><select required name="availability" class="w-full rounded-xl border p-3"><option>Available</option><option>Sold out</option><option>Unavailable</option></select><input name="image" type="url" placeholder="Image URL (optional)" class="w-full rounded-xl border p-3"><button id="save-meal" class="w-full rounded-xl bg-orange-500 p-3 font-semibold text-white">Publish meal</button><button type="button" id="cancel-edit" class="hidden w-full rounded-xl border p-3">Cancel edit</button></form></section><section><div class="flex items-center justify-between"><h2 class="text-2xl font-bold">Your listings</h2><span id="listing-count" class="text-sm text-stone-500"></span></div><div id="cook-listings" class="mt-5 grid gap-5 sm:grid-cols-2"></div></section></div></main><script src="homebite.js"></script><script src="cook-dashboard.js"></script></body></html>
